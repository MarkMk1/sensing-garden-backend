name: backend-ci

# Runs the HERMETIC backend test suite on every push / PR to main.
# "Hermetic" = no AWS account, no network, no credentials. See the exclusions
# below and reports/05-learning-path.md (Part 4) for the full rationale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Hard stop against any test accidentally reaching real AWS: provide a region
# (so botocore doesn't error on region lookup) but NO credentials, so any stray
# real call fails fast with NoCredentialsError instead of touching infrastructure.
env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The repo targets python ^3.9 (pyproject.toml). 3.11 is a current Lambda
        # runtime. Add more versions here to test the matrix, e.g. ["3.9", "3.11", "3.12"].
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies (locked, reproducible)
        # --no-root: this project ships code under lambda/src & trigger/src, not as
        # an installable package, so there is no root package to install.
        run: poetry install --no-root

      - name: Run hermetic tests
        # WHAT IS EXCLUDED AND WHY (revisit these as the suite is cleaned up):
        #
        #  --ignore test_csv_export_integration_real.py
        #     Hits a real deployed API Gateway with a HARDCODED url+key (now a dead
        #     401). Not hermetic. Should be deleted or rewritten against a mock.
        #
        #  --ignore test_integration_deletion.py
        #     Creates AND DELETES real data; self-skips without API creds, but we
        #     exclude it so a clean run is obvious rather than "skipped".
        #
        #  --deselect test_model_deletion.py::*  (2 tests)
        #     REAL FAILURE: they call routes.models.handle_delete, which does not
        #     exist (there is no DELETE /models route). Decide: implement the route,
        #     or delete the stale tests. Then remove these two --deselect lines.
        #
        #  --deselect test_dynamodb_deployments.py::*  (4 tests)
        #     BRITTLE: the test fakes string-match on str(KeyConditionExpression),
        #     which modern boto3 renders as "<...Equals object at 0x...>" (no value),
        #     so the fakes return the wrong branch. Rewrite to assert on the boto3
        #     condition objects properly, then remove these four --deselect lines.
        run: >
          poetry run pytest tests/ -q
          --cov=lambda/src --cov=trigger/src --cov-report=term-missing
          --ignore=tests/test_csv_export_integration_real.py
          --ignore=tests/test_integration_deletion.py
          --deselect "tests/test_model_deletion.py::test_handle_delete_model_requires_model_id"
          --deselect "tests/test_model_deletion.py::test_handle_delete_model_calls_dynamodb"
          --deselect "tests/test_dynamodb_deployments.py::test_load_table_items_for_devices_filters_legacy_timestamps_in_memory"
          --deselect "tests/test_dynamodb_deployments.py::test_load_items_for_query_data_without_device_id_queries_known_devices"
          --deselect "tests/test_dynamodb_deployments.py::test_list_tracks_queries_by_device_index"
          --deselect "tests/test_dynamodb_deployments.py::test_get_latest_heartbeats_queries_one_per_device"
